name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      # genekit is a private repo; uv shells out to git, which has no credentials
      # of its own on the runner. Rewrite github.com HTTPS URLs to carry the PAT.
      - name: Authenticate git for private genekit dependency
        env:
          GENEKIT_TOKEN: ${{ secrets.GENEKIT_TOKEN }}
        run: git config --global url."https://x-access-token:$env:GENEKIT_TOKEN@github.com/".insteadOf "https://github.com/"
      - run: uv sync --group dev
      - run: uv run pytest
      - run: uv run ruff check
